name: Build and Release Portable TICLR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install build dependencies
        shell: Rscript {0}
        run: |
          install.packages("renv", repos = "https://cloud.r-project.org")

      - name: Install portR from git
        shell: bash
        run: |
          rm -rf /tmp/portR
          git clone --depth 1 https://github.com/agerada/portR.git /tmp/portR
          Rscript -e 'install.packages("/tmp/portR", repos = NULL, type = "source")'

      - name: Restore renv library
        shell: Rscript {0}
        run: |
          if (file.exists("renv.lock")) {
            renv::restore(prompt = FALSE)
          }

      - name: Resolve release metadata
        id: meta
        shell: Rscript {0}
        run: |
          desc <- read.dcf("DESCRIPTION")
          version <- desc[1, "Version"]
          tag <- paste0("v", version)
          zip_name <- paste0("TICLR-", version, ".zip")
          output_file <- Sys.getenv("GITHUB_OUTPUT")
          cat(paste0("release_tag=", tag, "\n"), file = output_file, append = TRUE)
          cat(paste0("zip_name=", zip_name, "\n"), file = output_file, append = TRUE)

      - name: Build portable ZIP with portR
        shell: Rscript {0}
        run: |
          renv::install(".")
          portR::build_windows(
            project_path = ".",
            r_version = "4.5.2",
            shiny_command = "TICLR::run_app()",
            extra_dirs = c("inst"),
            create_zip = TRUE,
            zip_name = "${{ steps.meta.outputs.zip_name }}"
          )

      - name: Locate generated ZIP
        id: locate_zip
        shell: pwsh
        run: |
          $zipName = "${{ steps.meta.outputs.zip_name }}"
          $zip = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter $zipName | Select-Object -First 1
          if (-not $zip) {
            $zip = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter "TICLR*.zip" |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }

          if (-not $zip) {
            throw "No ZIP artifact found after build."
          }

          "zip_path=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check whether tag already exists
        id: tagcheck
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.release_tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and upload ZIP
        if: github.ref == 'refs/heads/main' && steps.tagcheck.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: TICLR ${{ steps.meta.outputs.release_tag }}
          files: ${{ steps.locate_zip.outputs.zip_path }}
          generate_release_notes: true

      - name: Skip notice for existing tag
        if: github.ref == 'refs/heads/main' && steps.tagcheck.outputs.skip_release == 'true'
        shell: bash
        run: |
          echo "Release tag ${{ steps.meta.outputs.release_tag }} already exists; skipping release creation."

      - name: Release skipped on non-main
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Non-main ref (${GITHUB_REF}); build/test completed and release publish intentionally skipped."
